[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precitec-data-parser"
version = "0.3.5"
description = "Parse and analyze height-map exports from Precitec CLS2 sensors (.csv and .bcrf formats)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Maxime Leurquin", email = "maxime.leurquin@gmail.com"}
]
keywords = [
    "precitec",
    "cls2",
    "height-map",
    "surface-analysis",
    "3d-imaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "surfalize[3d]",
]

[project.urls]
Homepage = "https://github.com/MaxLeurquin-commscope/precitec_data_parser"

[tool.hatch.build.targets.wheel]
packages = ["src/precitec_data_parser"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
